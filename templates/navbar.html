{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Custom CSS */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .logo-ai {
            width: 107px; /* Set the size of the logo */
        }

        .navbar {
            padding: 20px;
            position: static;
            width: 100%;
            background-color: #f8f9fa;
        }

        .navtop {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .navbar .navbar-nav {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links li {
            display: inline-block;
            margin-left: 20px;
        }

        .nav-links li a {
            text-decoration: none;
            color: #000; /* Default color */
            transition: color 0.3s ease; /* Smooth transition */
        }

        .nav-links li a:hover {
            color: #0b82e6; /* Change to blue on hover */
        }

        .navbar-toggler {
            border: none;
            background-color: transparent;
        }

        .navbar-toggler-icon {
            background-color: #000; /* Set the color for the hamburger icon */
        }
        .navbar-toggler-icon{
            background-color: white !important;
        }

        /* Responsive adjustments for mobile devices */
        @media (max-width: 768px) {
            .navbar-nav {
                text-align: center;
            }

            .navbar-nav li {
                display: block;
                margin-left: 0;
                padding: 10px 0;
            }

            .navbar-nav li a {
                font-size: 18px;
            }

            .navbar-toggler {
                margin-left: auto;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container navtop">
<a class="logo-aivv" href="{% url 'home' %}">

                <img src="{% static 'logo/aivestorlogo.png' %}" alt="Logo" class="logo-ai">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav nav-links">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">Logout</a>

                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'Aboutus' %}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Support</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
    <!-- Bootstrap JS and Popper.js (required for the toggle functionality) -->

<script>
    const toggleBtn = document.getElementById("theme-toggle");
    const current = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", current);

    toggleBtn.onclick = () => {
        const theme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
    };
</script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
